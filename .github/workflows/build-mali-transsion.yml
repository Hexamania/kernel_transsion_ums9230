name: Build Mali CSF Module (Transsion UMS9230)

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: 'Kernel branch/tag/commit to build (from fork)'
        required: false
        default: 'build-infra'
        type: string
      enable_csf:
        description: 'Enable CSF (Valhall) support'
        required: false
        default: true
        type: boolean
  push:
    branches:
      - master
    paths:
      - '.github/workflows/build-mali-transsion.yml'
      - 'kernel_modules/kernel5.4/gpu/gondul/mali/**'
      - 'arch/arm64/configs/bg6*_defconfig'
      - 'driver/product/kernel/include/uapi/gpu/arm/midgard/**'

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build Mali CSF Module
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # Use FORK's kernel repo (master branch has full kernel source with Mali driver)
      KERNEL_REPO: https://github.com/Hexamania/kernel_transsion_ums9230.git
      # Use master branch which has the full kernel source tree
      # build-infra branch is a minimal integration repo without full kernel source
      KERNEL_REF: ${{ github.event.inputs.kernel_ref || 'master' }}
      ENABLE_CSF: ${{ github.event.inputs.enable_csf || 'true' }}
      # Use fork's defconfig for T606/ums9230
      DEFCONFIG: bg6_defconfig
    outputs:
      kernel_commit: ${{ steps.get_commit.outputs.commit }}
      module_path: ${{ steps.find_module.outputs.path }}

    steps:
      - name: Checkout fork's kernel source (contains Mali driver and defconfigs)
        uses: actions/checkout@v4
        with:
          repository: Hexamania/kernel_transsion_ums9230
          ref: ${{ env.KERNEL_REF }}
          path: kernel
          submodules: false

      - name: Set kernel commit output
        id: get_commit
        run: |
          cd kernel
          echo "commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "KERNEL_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld llvm \
            libssl-dev bc flex bison libelf-dev dwarves \
            python3 git wget cpio kmod ccache \
            python3-pyelftools libncurses5-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup clang
        run: |
          clang --version
          which ld.lld
          which llvm-ar
          echo "CC=clang" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV
          echo "AR=llvm-ar" >> $GITHUB_ENV
          echo "NM=llvm-nm" >> $GITHUB_ENV
          echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
          echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
          echo "READELF=llvm-readelf" >> $GITHUB_ENV
          echo "STRIP=llvm-strip" >> $GITHUB_ENV

      - name: Check Mali CSF config in kernel
        run: |
          cd kernel
          echo "=== Mali configs in kernel defconfigs ==="
          grep -r "CONFIG_MALI" arch/arm64/configs/ 2>/dev/null | head -20 || echo "No Mali configs found in defconfigs"
          grep -r "CONFIG_MALI_CSF_SUPPORT" . 2>/dev/null || echo "CSF config not found in kernel source"

      - name: Verify fork's Mali driver exists (already at kernel_modules/kernel5.4/gpu/gondul/mali)
        if: ${{ env.ENABLE_CSF == 'true' }}
        run: |
          cd kernel
          MALI_DIR="kernel_modules/kernel5.4/gpu/gondul/mali"
          if [ -d "$MALI_DIR" ]; then
            echo "=== Fork's Mali driver found at $MALI_DIR ==="
            ls -la "$MALI_DIR/"
            # Verify CSF headers exist
            if [ -d "$MALI_DIR/csf" ]; then
              echo "CSF headers present in $MALI_DIR/csf/"
              ls -la "$MALI_DIR/csf/"
            fi
            # Verify native MGM exists
            if [ -f "$MALI_DIR/mali_kbase_native_mgm.c" ]; then
              echo "Native MGM implementation found ✓"
            fi
            # Verify memory_group_manager.h exists
            if [ -f "$MALI_DIR/memory_group_manager.h" ]; then
              echo "memory_group_manager.h found ✓"
            fi
          else
            echo "ERROR: Fork's Mali driver not found at $MALI_DIR!"
            exit 1
          fi

      - name: Disable KernelSU (not in fork's config)
        run: |
          cd kernel
          if [ -d "drivers/kernelsu" ]; then
            echo "KernelSU found, but fork's defconfig doesn't enable it. Disabling..."
            sed -i '/source "drivers\/kernelsu\/Kconfig"/d' drivers/Kconfig || true
            echo "KernelSU Kconfig source removed"
          else
            echo "KernelSU not found in kernel source, skipping"
          fi

      - name: Build kernel with fork's defconfig
        run: |
          cd kernel
          export ROOT_DIR=$(pwd)
          export KERNEL_DIR=""
          export ARCH=arm64
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf
          export STRIP=llvm-strip
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          # Disable Werror and add C99 standard for clang compatibility with older kernel code
          # -std=gnu11 enables C11 mode which allows 'for' loop initial declarations
          # Also disable shadow-call-stack which may not be supported
          export KCFLAGS="-Wno-error -Wno-return-type -Wno-misleading-indentation -Wno-implicit-int -Wno-implicit-function-declaration -fno-sanitize=shadow-call-stack -std=gnu11"

          echo "=== Using defconfig: ${DEFCONFIG} ==="
          DEFCONFIG_FILE="arch/arm64/configs/${DEFCONFIG}"
          if [ ! -f "$DEFCONFIG_FILE" ]; then
            echo "ERROR: Defconfig not found: $DEFCONFIG_FILE"
            ls arch/arm64/configs/
            exit 1
          fi

          make O=out ${DEFCONFIG}

          # Enable Mali CSF configs in kernel config
          echo "Enabling Mali CSF kernel configs..."
          ./scripts/config --file out/.config \
            --enable CONFIG_MALI_MIDGARD \
            --enable CONFIG_MALI_CSF_SUPPORT \
            --enable CONFIG_MALI_DEVFREQ \
            --enable CONFIG_MALI_GATOR_SUPPORT \
            --set-str CONFIG_MALI_PLATFORM_NAME devicetree \
            --disable CONFIG_MALI_DEBUG || true

          # Build kernel image and prepare for external modules
          echo "Building kernel image and preparing modules..."
          make O=out Image -j$(nproc)
          make O=out modules_prepare -j$(nproc)

          # Verify kernel build output
          echo "=== Kernel build output ==="
          ls -la out/arch/arm64/boot/Image 2>/dev/null || echo "Image not found"
          ls -la out/Module.symvers 2>/dev/null || echo "Module.symvers not found"

      - name: Install kernel headers (arm64) for external module build
        run: |
          cd kernel
          echo "=== Installing arm64 kernel headers ==="
          make O=out ARCH=arm64 headers_install -j$(nproc)
          echo "Headers installed to out/usr/include"
          ls -la out/usr/include/ 2>/dev/null | head -10

          # The Mali driver is at kernel_modules/kernel5.4/gpu/gondul/mali
          # It already has UAPI headers in include/uapi/
          MALI_DIR="kernel_modules/kernel5.4/gpu/gondul/mali"
          if [ -d "$MALI_DIR" ]; then
            echo "=== Copying fork's Mali UAPI headers to kernel installed headers ==="
            mkdir -p out/usr/include/uapi/gpu/arm/midgard
            # Copy from include/uapi/gpu/arm/midgard/
            if [ -d "$MALI_DIR/include/uapi/gpu/arm/midgard" ]; then
              cp -r "$MALI_DIR/include/uapi/gpu/arm/midgard/"* out/usr/include/uapi/gpu/arm/midgard/
              echo "Copied include/uapi headers"
            fi
            # Copy from gpu/ (GPU-specific headers like mali_kbase_gpu_regmap.h)
            if [ -d "$MALI_DIR/gpu" ]; then
              mkdir -p out/usr/include/uapi/gpu/arm/midgard/gpu
              cp -r "$MALI_DIR/gpu/"*.h out/usr/include/uapi/gpu/arm/midgard/gpu/
              echo "Copied gpu headers"
            fi
            # Copy CSF headers
            if [ -d "$MALI_DIR/include/uapi/gpu/arm/midgard/csf" ]; then
              mkdir -p out/usr/include/uapi/gpu/arm/midgard/csf
              cp -r "$MALI_DIR/include/uapi/gpu/arm/midgard/csf/"*.h out/usr/include/uapi/gpu/arm/midgard/csf/
              echo "Copied CSF UAPI headers"
            fi
            echo "UAPI headers installed to out/usr/include/uapi/gpu/arm/midgard/"
            ls -la out/usr/include/uapi/gpu/arm/midgard/
            ls -la out/usr/include/uapi/gpu/arm/midgard/gpu/ 2>/dev/null || true
            ls -la out/usr/include/uapi/gpu/arm/midgard/csf/ 2>/dev/null || true

            # Copy fork's version_compat_defs.h to kernel source tree include/linux
            echo "=== Copying fork's version_compat_defs.h to kernel source tree ==="
            if [ -f "$MALI_DIR/include/linux/version_compat_defs.h" ]; then
              mkdir -p include/linux
              cp "$MALI_DIR/include/linux/version_compat_defs.h" include/linux/
              echo "Copied version_compat_defs.h to include/linux/"
              ls -la include/linux/version_compat_defs.h
            else
              echo "WARNING: version_compat_defs.h not found in fork's driver"
            fi

            # Copy fork's memory_group_manager.h to kernel source tree include/linux
            echo "=== Copying fork's memory_group_manager.h to kernel source tree ==="
            if [ -f "$MALI_DIR/memory_group_manager.h" ]; then
              mkdir -p include/linux
              cp "$MALI_DIR/memory_group_manager.h" include/linux/
              echo "Copied memory_group_manager.h to include/linux/"
              ls -la include/linux/memory_group_manager.h
            else
              echo "WARNING: memory_group_manager.h not found in fork's driver"
            fi

            # Copy fork's Mali UAPI headers to kernel source tree include/uapi/
            echo "=== Copying fork's Mali UAPI headers to kernel source tree include/uapi/ ==="
            mkdir -p include/uapi/gpu/arm/midgard
            mkdir -p include/uapi/gpu/arm/midgard/gpu
            mkdir -p include/uapi/gpu/arm/midgard/csf
            if [ -d "$MALI_DIR/include/uapi/gpu/arm/midgard" ]; then
              cp -r "$MALI_DIR/include/uapi/gpu/arm/midgard/"* include/uapi/gpu/arm/midgard/
              echo "Copied include/uapi headers to include/uapi/"
            fi
            if [ -d "$MALI_DIR/gpu" ]; then
              cp -r "$MALI_DIR/gpu/"*.h include/uapi/gpu/arm/midgard/gpu/
              echo "Copied gpu headers to include/uapi/"
            fi
            if [ -d "$MALI_DIR/include/uapi/gpu/arm/midgard/csf" ]; then
              cp -r "$MALI_DIR/include/uapi/gpu/arm/midgard/csf/"*.h include/uapi/gpu/arm/midgard/csf/
              echo "Copied CSF UAPI headers to include/uapi/"
            fi

            # Also copy UAPI headers from platform-tools driver source (driver/product/kernel/include/uapi/gpu/arm/midgard/)
            UAPI_SRC="driver/product/kernel/include/uapi/gpu/arm/midgard"
            UAPI_DST="include/uapi/gpu/arm/midgard"
            OUT_UAPI_DST="out/include/uapi/gpu/arm/midgard"
            OUT_USR_UAPI_DST="out/usr/include/uapi/gpu/arm/midgard"

            if [ -d "$UAPI_SRC" ]; then
              echo "=== Copying UAPI headers from platform-tools driver source ==="

              # Copy mali_base_common_kernel.h
              if [ -f "$UAPI_SRC/mali_base_common_kernel.h" ]; then
                echo "Copying mali_base_common_kernel.h"
                cp "$UAPI_SRC/mali_base_common_kernel.h" "$UAPI_DST/"
                mkdir -p "$OUT_UAPI_DST" && cp "$UAPI_SRC/mali_base_common_kernel.h" "$OUT_UAPI_DST/"
                mkdir -p "$OUT_USR_UAPI_DST" && cp "$UAPI_SRC/mali_base_common_kernel.h" "$OUT_USR_UAPI_DST/"
              fi

              # Copy mali_base_mem_priv.h
              if [ -f "$UAPI_SRC/mali_base_mem_priv.h" ]; then
                echo "Copying mali_base_mem_priv.h"
                cp "$UAPI_SRC/mali_base_mem_priv.h" "$UAPI_DST/"
                mkdir -p "$OUT_UAPI_DST" && cp "$UAPI_SRC/mali_base_mem_priv.h" "$OUT_UAPI_DST/"
                mkdir -p "$OUT_USR_UAPI_DST" && cp "$UAPI_SRC/mali_base_mem_priv.h" "$OUT_USR_UAPI_DST/"
              fi

              # Copy mali_base_kernel.h
              if [ -f "$UAPI_SRC/mali_base_kernel.h" ]; then
                echo "Copying mali_base_kernel.h"
                cp "$UAPI_SRC/mali_base_kernel.h" "$UAPI_DST/"
                mkdir -p "$OUT_UAPI_DST" && cp "$UAPI_SRC/mali_base_kernel.h" "$OUT_UAPI_DST/"
                mkdir -p "$OUT_USR_UAPI_DST" && cp "$UAPI_SRC/mali_base_kernel.h" "$OUT_USR_UAPI_DST/"
              fi

              # Copy mali_kbase_ioctl.h
              if [ -f "$UAPI_SRC/mali_kbase_ioctl.h" ]; then
                echo "Copying mali_kbase_ioctl.h"
                cp "$UAPI_SRC/mali_kbase_ioctl.h" "$UAPI_DST/"
                mkdir -p "$OUT_UAPI_DST" && cp "$UAPI_SRC/mali_kbase_ioctl.h" "$OUT_UAPI_DST/"
                mkdir -p "$OUT_USR_UAPI_DST" && cp "$UAPI_SRC/mali_kbase_ioctl.h" "$OUT_USR_UAPI_DST/"
              fi

              # Copy CSF headers directory
              if [ -d "$UAPI_SRC/csf" ]; then
                echo "Copying CSF UAPI headers"
                mkdir -p "$UAPI_DST/csf"
                cp "$UAPI_SRC/csf/"*.h "$UAPI_DST/csf/"
                mkdir -p "$OUT_UAPI_DST/csf"
                cp "$UAPI_SRC/csf/"*.h "$OUT_UAPI_DST/csf/"
                mkdir -p "$OUT_USR_UAPI_DST/csf"
                cp "$UAPI_SRC/csf/"*.h "$OUT_USR_UAPI_DST/csf/"
              fi

              # Copy GPU headers directory
              if [ -d "$UAPI_SRC/gpu" ]; then
                echo "Copying GPU UAPI headers"
                mkdir -p "$UAPI_DST/gpu"
                cp "$UAPI_SRC/gpu/"*.h "$UAPI_DST/gpu/"
                mkdir -p "$OUT_UAPI_DST/gpu"
                cp "$UAPI_SRC/gpu/"*.h "$OUT_UAPI_DST/gpu/"
                mkdir -p "$OUT_USR_UAPI_DST/gpu"
                cp "$UAPI_SRC/gpu/"*.h "$OUT_USR_UAPI_DST/gpu/"
              fi

              echo "Copied all UAPI headers from platform-tools"
              ls -la "$UAPI_DST/"
              ls -la "$UAPI_DST/csf/" 2>/dev/null || true
              ls -la "$UAPI_DST/gpu/" 2>/dev/null || true
              echo "=== out/include/uapi ==="
              ls -la "$OUT_UAPI_DST/" 2>/dev/null || true
              echo "=== out/usr/include/uapi ==="
              ls -la "$OUT_USR_UAPI_DST/" 2>/dev/null || true
            else
              echo "WARNING: platform-tools UAPI headers not found at $UAPI_SRC"
            fi

            echo "UAPI headers installed to include/uapi/gpu/arm/midgard/"
            ls -la include/uapi/gpu/arm/midgard/
            ls -la include/uapi/gpu/arm/midgard/gpu/ 2>/dev/null || true
            ls -la include/uapi/gpu/arm/midgard/csf/ 2>/dev/null || true
          else
            echo "WARNING: Mali driver not found at $MALI_DIR, skipping UAPI header copy"
          fi

      - name: Build Mali module with CSF support (external module build)
        run: |
          cd kernel
          MALI_DIR="kernel_modules/kernel5.4/gpu/gondul/mali"
          if [ -d "$MALI_DIR" ]; then
            echo "=== Building Mali module with CSF support ==="
            echo "MALI_DIR: $MALI_DIR"

            # Build external module from kernel source tree using M= parameter
            # This uses the kernel source tree (which has all headers) with O=out for output
            # Must explicitly pass ARCH and CROSS_COMPILE since each step runs in separate shell
            # Add Mali driver's UAPI directories to include path for #include <uapi/gpu/arm/midgard/...>
            # Also add kernel source tree's include/ for CSF UAPI headers (since they're included as <uapi/...>)
            # Use EXTRA_CFLAGS (not KCFLAGS) for external module builds; use absolute paths
            MALI_ABS_DIR="$(pwd)/$MALI_DIR"
            KERNEL_ABS_DIR="$(pwd)"
            make O=out M="$MALI_DIR" \
              ARCH=arm64 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CONFIG_MALI_MIDGARD=m \
              CONFIG_MALI_CSF_SUPPORT=y \
              CONFIG_MALI_DEVFREQ=y \
              CONFIG_MALI_GATOR_SUPPORT=y \
              CONFIG_MALI_DEBUG=n \
              CONFIG_MALI_PLATFORM_NAME="devicetree" \
              EXTRA_CFLAGS="-Wno-error -Wno-return-type -Wno-misleading-indentation -Wno-implicit-int -Wno-implicit-function-declaration -fno-sanitize=shadow-call-stack -std=gnu11 -I$MALI_ABS_DIR -I$MALI_ABS_DIR/include -I$KERNEL_ABS_DIR/include" \
              -j$(nproc) modules

            echo "Mali module build completed"
          else
            echo "ERROR: Mali driver not found at $MALI_DIR!"
            find . -name "mali" -type d 2>/dev/null | head -10 || true
            exit 1
          fi

      - name: Verify module
        run: |
          cd kernel
          echo "=== Finding mali_kbase.ko ==="
          find . -name "mali_kbase.ko" -exec ls -lh {} \;
          find . -name "mali_kbase.ko" -exec file {} \;

      - name: Verify CSF support in module
        run: |
          cd kernel
          MODULE=$(find . -name "mali_kbase.ko" | head -1)
          if [ -z "$MODULE" ]; then
            echo "ERROR: mali_kbase.ko not found!"
            exit 1
          fi
          echo "=== Checking for CSF support in module ==="
          echo "Module: $MODULE"
          # Check for CSF-related strings in the module
          strings "$MODULE" | grep -i csf | head -20 || echo "No CSF strings found (may be in firmware)"
          # Check for CSF config in modinfo
          modinfo "$MODULE" | grep -i csf || true
          # Verify it's arm64
          file "$MODULE" | grep -q "aarch64" && echo "Module is aarch64 ✓" || echo "WARNING: Module may not be aarch64"
          # Check module size
          ls -lh "$MODULE"

      - name: Find module path for output
        id: find_module
        run: |
          cd kernel
          MODULE_PATH=$(find . -name "mali_kbase.ko" | head -1)
          if [ -z "$MODULE_PATH" ]; then
            echo "ERROR: mali_kbase.ko not found!"
            exit 1
          fi
          echo "path=$MODULE_PATH" >> $GITHUB_OUTPUT

      - name: Upload mali_kbase.ko
        uses: actions/upload-artifact@v4
        with:
          name: mali_kbase-ko-${{ env.KERNEL_COMMIT }}
          path: kernel/**/mali_kbase.ko
          retention-days: 30
          compression-level: 6

      - name: Upload build info
        run: |
          cd kernel
          echo "Kernel commit: ${KERNEL_COMMIT}" > build-info.txt
          echo "Branch: ${KERNEL_REF}" >> build-info.txt
          echo "CSF enabled: ${ENABLE_CSF}" >> build-info.txt
          echo "Defconfig: ${DEFCONFIG}" >> build-info.txt
          echo "Build date: $(date -u)" >> build-info.txt
          uname -a >> build-info.txt
          echo "Module size: $(ls -lh **/mali_kbase.ko 2>/dev/null | awk '{print $5}' | head -1)" >> build-info.txt
          cat build-info.txt

      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: build-info-${{ env.KERNEL_COMMIT }}
          path: kernel/build-info.txt
          retention-days: 30

  release:
    name: Create Release
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: mali-csf-${{ needs.build.outputs.kernel_commit || github.sha }}
          name: "Mali CSF Module - ${{ needs.build.outputs.kernel_commit || github.sha }}"
          body: |
            Mali kernel module with CSF (Valhall) support for Transsion UMS9230 (T606)

            **Kernel:** `${{ needs.build.outputs.kernel_commit || github.sha }}`
            **Branch:** `${{ github.event.inputs.kernel_ref || 'build-infra' }}`
            **Defconfig:** `bg6_defconfig`
            **CSF Enabled:** ${{ github.event.inputs.enable_csf || 'true' }}

            **Install:**
            ```bash
            adb push mali_kbase.ko /data/local/tmp/
            adb shell "insmod /data/local/tmp/mali_kbase.ko"
            ```

            **Verify:**
            ```bash
            adb shell "dmesg -T | grep -i -e mali -e csf"
            ```
          files: |
            artifacts/mali_kbase-ko-*/mali_kbase.ko
            artifacts/build-info-*/build-info.txt
          draft: false
          prerelease: false