name: Build Mali CSF Module (Transsion UMS9230 GKI)

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: 'Kernel branch/tag/commit to build'
        required: false
        default: 'master'
        type: string
      enable_csf:
        description: 'Enable CSF (Valhall) support'
        required: false
        default: true
        type: boolean
  push:
    branches:
      - build-infra
    paths:
      - '.github/workflows/build-mali-transsion.yml'
      - 'drivers/mali/arm-official/**'
      - 'build/**'

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build Mali CSF Module
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KERNEL_REPO: https://github.com/Bocchi-The-Dev/kernel_transsion_ums9230.git
      KERNEL_REF: ${{ github.event.inputs.kernel_ref || 'master' }}
      ENABLE_CSF: ${{ github.event.inputs.enable_csf || 'true' }}

    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld llvm \
            libssl-dev bc flex bison libelf-dev dwarves \
            python3 git wget cpio kmod ccache \
            python3-pyelftools libncurses5-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup clang
        run: |
          clang --version
          which ld.lld
          which llvm-ar

      - name: Clone kernel source (full, for submodules and build.sh)
        run: |
          git clone --branch "${KERNEL_REF}" "${KERNEL_REPO}" kernel
          cd kernel
          git submodule update --init --recursive || echo "Submodule init failed, continuing..."
          echo "KERNEL_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Check Mali CSF config
        run: |
          cd kernel
          echo "=== Mali configs ==="
          grep -r "CONFIG_MALI" arch/arm64/configs/ 2>/dev/null | head -20 || true
          grep -r "CONFIG_MALI_CSF_SUPPORT" . || echo "CSF config not found"

      - name: Apply ARM Mali driver (BX304L01B-r44p1)
        if: ${{ env.ENABLE_CSF == 'true' }}
        run: |
          cd kernel
          if [ ! -d "kernel_modules/kernel5.4/gpu/gondul/mali_new" ]; then
            mkdir -p kernel_modules/kernel5.4/gpu/gondul
            cp -r ${{ github.workspace }}/drivers/mali/arm-official \
              kernel_modules/kernel5.4/gpu/gondul/mali_new
          fi

      - name: Build kernel (GKI style)
        run: |
          cd kernel
          # Debug: show build.config content
          echo "=== build.config.gki.aarch64 ==="
          cat build.config.gki.aarch64
          echo "================================="

          # Check if build.sh exists in kernel source (full clone)
          # Remove build.sh to force manual build path (skips broken modules build)
          rm -f build.sh
          echo "Removed build.sh to force manual build path"

          # Handle KernelSU Kconfig issue - disable if not present
          if [ ! -d "drivers/kernelsu" ]; then
            echo "KernelSU not found, disabling in Kconfig..."
            sed -i '/source "drivers\/kernelsu\/Kconfig"/d' drivers/Kconfig || true
          fi

          # Manual GKI build by sourcing build.config chain (skips broken modules build)
          echo "Using manual GKI build by sourcing build.config chain..."
          # Source the build.config chain to get defconfig
          # build.config.gki.aarch64 sources: build.config.common, build.config.aarch64, build.config.gki
          # These files are in the kernel root, so ROOT_DIR=kernel_root, KERNEL_DIR=""
          export ROOT_DIR=$(pwd)
          export KERNEL_DIR=""

          # Source the build.config files in order
          if [ -f "build.config.common" ]; then
            source build.config.common
          fi
          if [ -f "build.config.aarch64" ]; then
            source build.config.aarch64
          fi
          if [ -f "build.config.gki" ]; then
            source build.config.gki
          fi
          # Now source the main config which may set GKI_DEFCONFIG_FRAGMENT
          source build.config.gki.aarch64

          # Ensure MAKE_GOALS is set to only Image.lz4 (override build.config which may include modules)
          # This skips dtbs and modules which have broken vendor touchscreen/NFC modules
          MAKE_GOALS="Image.lz4"

          # Get defconfig from GKI_DEFCONFIG_FRAGMENT or KERNEL_DEFCONFIG
          if [ -n "${GKI_DEFCONFIG_FRAGMENT}" ] && [ -f "${GKI_DEFCONFIG_FRAGMENT}" ]; then
            DEFCONFIG=$(grep -E '^KERNEL_DEFCONFIG=' "${GKI_DEFCONFIG_FRAGMENT}" | head -1 | cut -d= -f2- | tr -d '"' | tr -d "'" | xargs || echo "gki_defconfig")
          else
            DEFCONFIG=$(grep -E '^KERNEL_DEFCONFIG=' build.config.gki 2>/dev/null | head -1 | cut -d= -f2- | tr -d '"' | tr -d "'" | xargs || echo "gki_defconfig")
          fi

          EXTRA_CONFIGS=$(grep -E '^EXTRA_CONFIGS=' build.config.gki 2>/dev/null | head -1 | cut -d= -f2- | tr -d '"' | tr -d "'" | xargs || echo "")

          echo "DEFCONFIG: '${DEFCONFIG}'"
          echo "EXTRA_CONFIGS: '${EXTRA_CONFIGS}'"

          export ARCH=arm64
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf
          export STRIP=llvm-strip
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          # Disable Werror for compatibility with newer clang (Ubuntu 26.04)
          export KCFLAGS="-Wno-error -Wno-return-type -Wno-misleading-indentation -Wno-implicit-int -Wno-implicit-function-declaration"

          # Check if defconfig exists
          if [ -f "arch/arm64/configs/${DEFCONFIG}" ] || [ -f "arch/arm64/configs/${DEFCONFIG}_defconfig" ]; then
            make O=out ${DEFCONFIG}
          else
            # Try common GKI defconfigs
            for d in gki_defconfig gki_aarch64_defconfig vendor_gki_defconfig; do
              if [ -f "arch/arm64/configs/${d}" ]; then
                DEFCONFIG=$d
                break
              fi
            done
            echo "Using defconfig: ${DEFCONFIG}"
            make O=out ${DEFCONFIG}
          fi

          if [ -n "${EXTRA_CONFIGS}" ]; then
            for config in ${EXTRA_CONFIGS}; do
              if [ -f "${config}" ]; then
                scripts/kconfig/merge_config.sh -m -O out out/.config ${config}
              else
                echo "Config fragment not found: ${config}"
              fi
            done
          fi
          # Use MAKE_GOALS from build.config to skip dtbs (which has a DTS bug in qcom ipq8074-hk01.dts)
          make O=out ${MAKE_GOALS} -j$(nproc)

          # Skip 'make modules' - some vendor modules (touchscreen/NFC) have broken dependencies
          # We only need kernel output (Module.symvers, .config) for building external Mali module
          echo "Skipping in-tree modules build (has broken vendor modules); proceeding to Mali module build"

          # Prepare kernel build environment for external modules (installs headers, scripts, Module.symvers)
          echo "Preparing kernel build environment for external modules..."
          make O=out modules_prepare -j$(nproc)

      - name: Build Mali module with CSF
        run: |
          cd kernel
          MALI_DIR="kernel_modules/kernel5.4/gpu/gondul/mali_new"
          if [ -d "$MALI_DIR" ]; then
            # Install headers in output directory first (needed for external module builds with O=)
            echo "Installing kernel headers in output directory..."
            make O=out headers_install -j$(nproc)

            # Build external module from kernel source tree using M= parameter
            # This uses the kernel source tree (which has all headers) instead of output directory
            # Disable shadow-call-stack sanitizer (not supported on Ubuntu 26.04 clang)
            make O=out M="$MALI_DIR" \
              CONFIG_MALI_MIDGARD=m \
              CONFIG_MALI_CSF_SUPPORT=y \
              CONFIG_MALI_DEVFREQ=y \
              CONFIG_MALI_GATOR_SUPPORT=y \
              CONFIG_MALI_DEBUG=n \
              CONFIG_MALI_PLATFORM_NAME="devicetree" \
              KCFLAGS="-Wno-error -Wno-return-type -Wno-misleading-indentation -Wno-implicit-int -Wno-implicit-function-declaration -fno-sanitize=shadow-call-stack" \
              -j$(nproc) modules
          else
            echo "Mali driver not found!"
            exit 1
          fi

      - name: Verify module
        run: |
          cd kernel
          find . -name "mali_kbase.ko" -exec ls -lh {} \;
          find . -name "mali_kbase.ko" -exec file {} \;

      - name: Upload mali_kbase.ko
        uses: actions/upload-artifact@v4
        with:
          name: mali_kbase-ko-${{ env.KERNEL_COMMIT }}
          path: kernel/**/mali_kbase.ko
          retention-days: 30
          compression-level: 6

      - name: Upload build info
        run: |
          cd kernel
          echo "Kernel commit: ${KERNEL_COMMIT}" > build-info.txt
          echo "Branch: ${KERNEL_REF}" >> build-info.txt
          echo "CSF enabled: ${ENABLE_CSF}" >> build-info.txt
          echo "Build date: $(date -u)" >> build-info.txt
          uname -a >> build-info.txt
          echo "Module size: $(ls -lh **/mali_kbase.ko 2>/dev/null | awk '{print $5}' | head -1)" >> build-info.txt
          cat build-info.txt

      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: build-info-${{ env.KERNEL_COMMIT }}
          path: kernel/build-info.txt
          retention-days: 30

  release:
    name: Create Release
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: mali-csf-${{ needs.build.outputs.kernel_commit || github.sha }}
          name: "Mali CSF Module - ${{ needs.build.outputs.kernel_commit || github.sha }}"
          body: |
            Mali kernel module with CSF (Valhall) support for Transsion UMS9230

            **Kernel:** `${{ needs.build.outputs.kernel_commit || github.sha }}`
            **Branch:** `${{ github.event.inputs.kernel_ref || 'master' }}`
            **CSF Enabled:** ${{ github.event.inputs.enable_csf || 'true' }}

            **Install:**
            ```bash
            adb push mali_kbase.ko /data/local/tmp/
            adb shell "insmod /data/local/tmp/mali_kbase.ko"
            ```

            **Verify:**
            ```bash
            adb shell "dmesg -T | grep -i -e mali -e csf"
            ```
          files: |
            artifacts/mali_kbase-ko-*/mali_kbase.ko
            artifacts/build-info-*/build-info.txt
          draft: false
          prerelease: false