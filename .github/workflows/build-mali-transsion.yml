name: Build Mali CSF Module (Transsion UMS9230 GKI)

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: 'Kernel branch/tag/commit to build'
        required: false
        default: 'master'
        type: string
      enable_csf:
        description: 'Enable CSF (Valhall) support'
        required: false
        default: true
        type: boolean
  push:
    branches:
      - build-infra
    paths:
      - '.github/workflows/build-mali-transsion.yml'
      - 'drivers/mali/arm-official/**'
      - 'driver/product/**'
      - 'build/**'

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build Mali CSF Module
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KERNEL_REPO: https://github.com/Bocchi-The-Dev/kernel_transsion_ums9230.git
      KERNEL_REF: ${{ github.event.inputs.kernel_ref || 'master' }}
      ENABLE_CSF: ${{ github.event.inputs.enable_csf || 'true' }}
    outputs:
      kernel_commit: ${{ steps.get_commit.outputs.commit }}
      module_path: ${{ steps.find_module.outputs.path }}

    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld llvm \
            libssl-dev bc flex bison libelf-dev dwarves \
            python3 git wget cpio kmod ccache \
            python3-pyelftools libncurses5-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup clang
        run: |
          clang --version
          which ld.lld
          which llvm-ar
          echo "CC=clang" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV
          echo "AR=llvm-ar" >> $GITHUB_ENV
          echo "NM=llvm-nm" >> $GITHUB_ENV
          echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
          echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
          echo "READELF=llvm-readelf" >> $GITHUB_ENV
          echo "STRIP=llvm-strip" >> $GITHUB_ENV

      - name: Clone kernel source (full, for submodules and build.config)
        run: |
          git clone --branch "${KERNEL_REF}" "${KERNEL_REPO}" kernel
          cd kernel
          git submodule update --init --recursive || echo "Submodule init failed, continuing..."
          echo "KERNEL_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Set kernel commit output
        id: get_commit
        run: |
          cd kernel
          echo "commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Check Mali CSF config in kernel
        run: |
          cd kernel
          echo "=== Mali configs in kernel defconfigs ==="
          grep -r "CONFIG_MALI" arch/arm64/configs/ 2>/dev/null | head -20 || echo "No Mali configs found in defconfigs"
          grep -r "CONFIG_MALI_CSF_SUPPORT" . 2>/dev/null || echo "CSF config not found in kernel source"

      - name: Apply ARM Mali driver (BX304L01B-r44p1)
        if: ${{ env.ENABLE_CSF == 'true' }}
        run: |
          cd kernel
          if [ ! -d "kernel_modules/kernel5.4/gpu/gondul/mali_new" ]; then
            mkdir -p kernel_modules/kernel5.4/gpu/gondul/mali_new
            # Copy contents of arm-official directly to mali_new (not the directory itself)
            cp -r ${{ github.workspace }}/drivers/mali/arm-official/. \
              kernel_modules/kernel5.4/gpu/gondul/mali_new/
            echo "ARM Mali driver copied to kernel_modules/kernel5.4/gpu/gondul/mali_new"
          else
            echo "ARM Mali driver already present"
          fi
          ls -la kernel_modules/kernel5.4/gpu/gondul/mali_new/

      - name: Copy CSF headers to ARM Mali driver
        if: ${{ env.ENABLE_CSF == 'true' }}
        run: |
          cd kernel
          MALI_DIR="kernel_modules/kernel5.4/gpu/gondul/mali_new"
          if [ -d "$MALI_DIR" ]; then
            echo "=== Copying CSF headers to ARM Mali driver ==="
            # The CSF headers are in the existing gondul_mali driver source
            # Need to copy them to base/csf/ to match #include <csf/mali_base_csf_kernel.h>
            if [ -d "${{ github.workspace }}/driver/gondul_mali/csf" ]; then
              mkdir -p "$MALI_DIR/base/csf"
              cp -r "${{ github.workspace }}/driver/gondul_mali/csf/"*.h "$MALI_DIR/base/csf/"
              echo "CSF headers copied to $MALI_DIR/base/csf/"
              ls -la "$MALI_DIR/base/csf/"
            elif [ -d "${{ github.workspace }}/drivers/mali/gondul-rmx3511/csf" ]; then
              mkdir -p "$MALI_DIR/base/csf"
              cp -r "${{ github.workspace }}/drivers/mali/gondul-rmx3511/csf/"*.h "$MALI_DIR/base/csf/"
              echo "CSF headers copied from gondul-rmx3511 to $MALI_DIR/base/csf/"
              ls -la "$MALI_DIR/base/csf/"
            else
              echo "WARNING: CSF headers not found in workspace"
            fi
          fi

      - name: Handle KernelSU Kconfig (disable if missing)
        run: |
          cd kernel
          if [ ! -d "drivers/kernelsu" ]; then
            echo "KernelSU not found, disabling in Kconfig..."
            if [ -f "drivers/Kconfig" ]; then
              sed -i '/source "drivers\/kernelsu\/Kconfig"/d' drivers/Kconfig || true
              echo "KernelSU Kconfig source removed"
            else
              echo "drivers/Kconfig not found, skipping"
            fi
          else
            echo "KernelSU found, keeping enabled"
          fi

      - name: Build kernel (GKI style - manual build.config chain)
        run: |
          cd kernel
          echo "=== Debug: Checking build.config files ==="
          ls -la build.config* 2>/dev/null || echo "No build.config files found in root"

          # Remove build.sh to force manual build path (skips broken modules build)
          if [ -f "build.sh" ]; then
            rm -f build.sh
            echo "Removed build.sh to force manual build path"
          fi

          # Manual GKI build by sourcing build.config chain
          # build.config.gki.aarch64 sources: build.config.common, build.config.aarch64, build.config.gki
          # These files are in the kernel root, so ROOT_DIR=kernel_root, KERNEL_DIR=""
          export ROOT_DIR=$(pwd)
          export KERNEL_DIR=""
          export ARCH=arm64
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf
          export STRIP=llvm-strip
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          # Disable Werror and shadow-call-stack for compatibility with newer clang (Ubuntu 26.04)
          export KCFLAGS="-Wno-error -Wno-return-type -Wno-misleading-indentation -Wno-implicit-int -Wno-implicit-function-declaration -fno-sanitize=shadow-call-stack"

          echo "=== Sourcing build.config chain ==="
          # Source build.config files in order, with error handling
          for config in build.config.common build.config.aarch64 build.config.gki build.config.gki.aarch64; do
            if [ -f "${config}" ]; then
              echo "Sourcing ${config}..."
              source "${config}" || { echo "Failed to source ${config}"; exit 1; }
            else
              echo "WARNING: ${config} not found, skipping"
            fi
          done

          # Ensure MAKE_GOALS is set to only Image.lz4 (override build.config which may include modules/dtbs)
          # This skips dtbs (which has a DTS bug in qcom ipq8074-hk01.dts) and modules (broken vendor modules)
          MAKE_GOALS="Image.lz4"
          echo "MAKE_GOALS: ${MAKE_GOALS}"

          # Get defconfig from GKI_DEFCONFIG_FRAGMENT or KERNEL_DEFCONFIG
          DEFCONFIG=""
          if [ -n "${GKI_DEFCONFIG_FRAGMENT}" ] && [ -f "${GKI_DEFCONFIG_FRAGMENT}" ]; then
            echo "Found GKI_DEFCONFIG_FRAGMENT: ${GKI_DEFCONFIG_FRAGMENT}"
            DEFCONFIG=$(grep -E '^KERNEL_DEFCONFIG=' "${GKI_DEFCONFIG_FRAGMENT}" | head -1 | cut -d= -f2- | tr -d '"' | tr -d "'" | xargs || true)
          fi

          if [ -z "${DEFCONFIG}" ]; then
            DEFCONFIG=$(grep -E '^KERNEL_DEFCONFIG=' build.config.gki 2>/dev/null | head -1 | cut -d= -f2- | tr -d '"' | tr -d "'" | xargs || true)
          fi

          if [ -z "${DEFCONFIG}" ]; then
            DEFCONFIG="gki_defconfig"
          fi

          EXTRA_CONFIGS=$(grep -E '^EXTRA_CONFIGS=' build.config.gki 2>/dev/null | head -1 | cut -d= -f2- | tr -d '"' | tr -d "'" | xargs || true)

          echo "DEFCONFIG: '${DEFCONFIG}'"
          echo "EXTRA_CONFIGS: '${EXTRA_CONFIGS}'"

          # Check if defconfig exists
          DEFCONFIG_FILE=""
          if [ -f "arch/arm64/configs/${DEFCONFIG}" ]; then
            DEFCONFIG_FILE="arch/arm64/configs/${DEFCONFIG}"
          elif [ -f "arch/arm64/configs/${DEFCONFIG}_defconfig" ]; then
            DEFCONFIG_FILE="arch/arm64/configs/${DEFCONFIG}_defconfig"
            DEFCONFIG="${DEFCONFIG}_defconfig"
          else
            # Try common GKI defconfigs
            for d in gki_defconfig gki_aarch64_defconfig vendor_gki_defconfig; do
              if [ -f "arch/arm64/configs/${d}" ]; then
                DEFCONFIG=$d
                DEFCONFIG_FILE="arch/arm64/configs/${d}"
                break
              fi
            done
          fi

          if [ -z "${DEFCONFIG_FILE}" ]; then
            echo "ERROR: No valid defconfig found!"
            ls arch/arm64/configs/ | head -20
            exit 1
          fi

          echo "Using defconfig file: ${DEFCONFIG_FILE}"
          make O=out ${DEFCONFIG}

          # Apply extra config fragments if any
          if [ -n "${EXTRA_CONFIGS}" ]; then
            for config in ${EXTRA_CONFIGS}; do
              if [ -f "${config}" ]; then
                echo "Merging config fragment: ${config}"
                scripts/kconfig/merge_config.sh -m -O out out/.config "${config}"
              else
                echo "WARNING: Config fragment not found: ${config}"
              fi
            done
          fi

          # Enable Mali CSF configs in kernel config
          echo "Enabling Mali CSF kernel configs..."
          ./scripts/config --file out/.config \
            --enable CONFIG_MALI_MIDGARD \
            --enable CONFIG_MALI_CSF_SUPPORT \
            --enable CONFIG_MALI_DEVFREQ \
            --enable CONFIG_MALI_GATOR_SUPPORT \
            --set-str CONFIG_MALI_PLATFORM_NAME devicetree \
            --disable CONFIG_MALI_DEBUG || true

          # Build kernel image only (skip dtbs and modules)
          echo "Building kernel image..."
          make O=out ${MAKE_GOALS} -j$(nproc)

          # Prepare kernel build environment for external modules
          # This installs headers, scripts, Module.symvers needed for building external modules
          echo "Preparing kernel build environment for external modules..."
          make O=out modules_prepare -j$(nproc)

          # Verify kernel build output
          echo "=== Kernel build output ==="
          ls -la out/arch/arm64/boot/Image.lz4 2>/dev/null || echo "Image.lz4 not found"
          ls -la out/Module.symvers 2>/dev/null || echo "Module.symvers not found"

      - name: Install kernel headers (arm64) for external module build
        run: |
          cd kernel
          echo "=== Installing arm64 kernel headers ==="
          # Must specify ARCH=arm64 to install arm64 headers, not host x86 headers
          # This installs to out/usr/include which is where the kernel build system looks
          make O=out ARCH=arm64 headers_install -j$(nproc)
          echo "Headers installed to out/usr/include"
          ls -la out/usr/include/ 2>/dev/null | head -10

          # Copy ARM Mali driver UAPI headers to kernel installed headers
          # The ARM Mali driver (BX304L01B-r44p1) has UAPI headers in base/uapi/ and include/uapi/
          # These need to be in the kernel's header installation path for the module build to find them
          # Source includes use: #include <uapi/gpu/arm/midgard/mali_base_kernel.h>
          # So headers must be installed at out/usr/include/uapi/gpu/arm/midgard/
          MALI_DIR="kernel_modules/kernel5.4/gpu/gondul/mali_new"
          if [ -d "$MALI_DIR" ]; then
            echo "=== Copying ARM Mali UAPI headers to kernel installed headers ==="
            # Create the target directory (with uapi/ prefix to match #include <uapi/...>)
            mkdir -p out/usr/include/uapi/gpu/arm/midgard
            # Copy from base/uapi/gpu/arm/midgard/
            if [ -d "$MALI_DIR/base/uapi/gpu/arm/midgard" ]; then
              cp -r "$MALI_DIR/base/uapi/gpu/arm/midgard/"* out/usr/include/uapi/gpu/arm/midgard/
              echo "Copied base/uapi headers"
            fi
            # Copy from include/uapi/gpu/arm/midgard/
            if [ -d "$MALI_DIR/include/uapi/gpu/arm/midgard" ]; then
              cp -r "$MALI_DIR/include/uapi/gpu/arm/midgard/"* out/usr/include/uapi/gpu/arm/midgard/
              echo "Copied include/uapi headers"
            fi
            # Copy from midgard/gpu/ (GPU-specific headers like mali_kbase_gpu_regmap.h)
            # These are included as <uapi/gpu/arm/midgard/gpu/...>
            if [ -d "$MALI_DIR/midgard/gpu" ]; then
              mkdir -p out/usr/include/uapi/gpu/arm/midgard/gpu
              cp -r "$MALI_DIR/midgard/gpu/"*.h out/usr/include/uapi/gpu/arm/midgard/gpu/
              echo "Copied midgard/gpu headers"
            fi
            echo "UAPI headers installed to out/usr/include/uapi/gpu/arm/midgard/"
            ls -la out/usr/include/uapi/gpu/arm/midgard/
            ls -la out/usr/include/uapi/gpu/arm/midgard/gpu/ 2>/dev/null || true
            # Copy ARM Mali version_compat_defs.h to kernel source tree include/linux
            # The Mali driver includes: #include <linux/version_compat_defs.h>
            # This is an ARM compatibility header from the Mali driver source
            # The external module build (make O=out M=...) looks for headers in the kernel source tree
            echo "=== Copying ARM Mali version_compat_defs.h to kernel source tree ==="
            if [ -f "${{ github.workspace }}/drivers/mali/arm-official/include/linux/version_compat_defs.h" ]; then
              mkdir -p include/linux
              cp "${{ github.workspace }}/drivers/mali/arm-official/include/linux/version_compat_defs.h" include/linux/
              echo "Copied version_compat_defs.h to include/linux/"
              ls -la include/linux/version_compat_defs.h
            else
              echo "WARNING: version_compat_defs.h not found in workspace"
            fi

            # Copy ARM Mali memory_group_manager.h compatibility header to kernel source tree include/linux
            # The Mali driver includes: #include <linux/memory_group_manager.h>
            # This header is only available in Linux 6.6+, so we provide a compatibility version for older kernels
            echo "=== Copying ARM Mali memory_group_manager.h compatibility header to kernel source tree ==="
            if [ -f "${{ github.workspace }}/drivers/mali/arm-official/include/linux/memory_group_manager.h" ]; then
              mkdir -p include/linux
              cp "${{ github.workspace }}/drivers/mali/arm-official/include/linux/memory_group_manager.h" include/linux/
              echo "Copied memory_group_manager.h to include/linux/"
              ls -la include/linux/memory_group_manager.h
            else
              echo "WARNING: memory_group_manager.h not found in workspace"
            fi

            # Copy ARM Mali UAPI headers to kernel source tree include/uapi/
            # The kernel build system for external modules (make O=out M=...) looks for
            # UAPI headers in the kernel source tree's include/uapi/ directory
            # The Mali driver uses: #include <uapi/gpu/arm/midgard/...> and #include <uapi/gpu/arm/midgard/gpu/...>
            echo "=== Copying ARM Mali UAPI headers to kernel source tree include/uapi/ ==="
            mkdir -p include/uapi/gpu/arm/midgard
            mkdir -p include/uapi/gpu/arm/midgard/gpu
            # Copy from base/uapi/gpu/arm/midgard/
            if [ -d "$MALI_DIR/base/uapi/gpu/arm/midgard" ]; then
              cp -r "$MALI_DIR/base/uapi/gpu/arm/midgard/"* include/uapi/gpu/arm/midgard/
              echo "Copied base/uapi headers to include/uapi/"
            fi
            # Copy from include/uapi/gpu/arm/midgard/
            if [ -d "$MALI_DIR/include/uapi/gpu/arm/midgard" ]; then
              cp -r "$MALI_DIR/include/uapi/gpu/arm/midgard/"* include/uapi/gpu/arm/midgard/
              echo "Copied include/uapi headers to include/uapi/"
            fi
            # Copy from midgard/gpu/ (GPU-specific headers like mali_kbase_gpu_regmap.h)
            # These are included as <uapi/gpu/arm/midgard/gpu/...>
            if [ -d "$MALI_DIR/midgard/gpu" ]; then
              cp -r "$MALI_DIR/midgard/gpu/"*.h include/uapi/gpu/arm/midgard/gpu/
              echo "Copied midgard/gpu headers to include/uapi/"
            fi

            # Copy CSF UAPI headers from ARM Mali driver
            # The ARM Mali driver expects CSF UAPI headers at uapi/gpu/arm/midgard/csf/
            # These are not included in the ARM driver source package, so we provide them
            mkdir -p include/uapi/gpu/arm/midgard/csf
            if [ -d "$MALI_DIR/include/uapi/gpu/arm/midgard/csf" ]; then
              cp -r "$MALI_DIR/include/uapi/gpu/arm/midgard/csf/"*.h include/uapi/gpu/arm/midgard/csf/
              echo "Copied ARM Mali CSF UAPI headers to include/uapi/"
            fi

            # Copy CSF UAPI headers from existing kernel Mali driver
            # The kernel's existing Mali driver (at kernel_modules/kernel5.4/gpu/gondul/)
            # may have CSF UAPI headers that the ARM Mali driver expects
            EXISTING_MALI_DIR="kernel_modules/kernel5.4/gpu/gondul"
            if [ -d "$EXISTING_MALI_DIR/midgard/csf" ]; then
              mkdir -p include/uapi/gpu/arm/midgard/csf
              # Look for UAPI headers in the existing driver's csf directory
              find "$EXISTING_MALI_DIR/midgard/csf" -name "*.h" -path "*uapi*" 2>/dev/null | while read hdr; do
                cp "$hdr" include/uapi/gpu/arm/midgard/csf/ 2>/dev/null || true
              done
              # Also check if there are any headers directly in midgard/csf that might be UAPI
              # The ARM Mali driver expects headers at uapi/gpu/arm/midgard/csf/
              if [ -d "$EXISTING_MALI_DIR/midgard/csf" ]; then
                # Copy any header files that might be UAPI headers
                cp "$EXISTING_MALI_DIR/midgard/csf/"*.h include/uapi/gpu/arm/midgard/csf/ 2>/dev/null || true
              fi
              if [ -d "$EXISTING_MALI_DIR/midgard/csf/ipa_control" ]; then
                mkdir -p include/uapi/gpu/arm/midgard/csf/ipa_control
                cp "$EXISTING_MALI_DIR/midgard/csf/ipa_control/"*.h include/uapi/gpu/arm/midgard/csf/ipa_control/ 2>/dev/null || true
              fi
              echo "Copied CSF UAPI headers from existing Mali driver"
              ls -la include/uapi/gpu/arm/midgard/csf/ 2>/dev/null || true
            fi

            # Also check the kernel's own include/uapi for CSF headers
            if [ -d "include/uapi/gpu/arm/midgard/csf" ]; then
              echo "Kernel already has CSF UAPI headers at include/uapi/gpu/arm/midgard/csf/"
              ls -la include/uapi/gpu/arm/midgard/csf/
            fi

            # Copy CSF UAPI headers from current repo (platform-tools) - authoritative source
            # The platform-tools repo has the kernel driver source with correct CSF headers
            PLATFORM_TOOLS_PATH="${{ github.workspace }}"
            if [ -d "$PLATFORM_TOOLS_PATH/driver/product/kernel/include/uapi/gpu/arm/midgard/csf" ]; then
              echo "=== Copying CSF UAPI headers from platform-tools driver source ==="
              mkdir -p include/uapi/gpu/arm/midgard/csf
              cp -r "$PLATFORM_TOOLS_PATH/driver/product/kernel/include/uapi/gpu/arm/midgard/csf/"*.h include/uapi/gpu/arm/midgard/csf/
              echo "Copied CSF UAPI headers from platform-tools"
              ls -la include/uapi/gpu/arm/midgard/csf/
            else
              echo "WARNING: platform-tools CSF headers not found at $PLATFORM_TOOLS_PATH/driver/product/kernel/include/uapi/gpu/arm/midgard/csf"
            fi

            # Copy mali_kbase_ioctl.h from platform-tools driver source
            if [ -f "$PLATFORM_TOOLS_PATH/driver/product/kernel/include/uapi/gpu/arm/midgard/mali_kbase_ioctl.h" ]; then
              echo "=== Copying mali_kbase_ioctl.h from platform-tools driver source ==="
              cp "$PLATFORM_TOOLS_PATH/driver/product/kernel/include/uapi/gpu/arm/midgard/mali_kbase_ioctl.h" include/uapi/gpu/arm/midgard/
              echo "Copied mali_kbase_ioctl.h"
              ls -la include/uapi/gpu/arm/midgard/mali_kbase_ioctl.h
            else
              echo "WARNING: mali_kbase_ioctl.h not found in platform-tools"
            fi

            echo "UAPI headers installed to include/uapi/gpu/arm/midgard/"
            ls -la include/uapi/gpu/arm/midgard/
            ls -la include/uapi/gpu/arm/midgard/gpu/ 2>/dev/null || true
            ls -la include/uapi/gpu/arm/midgard/csf/ 2>/dev/null || true
          else
            echo "WARNING: Mali driver not found at $MALI_DIR, skipping UAPI header copy"
          fi

      - name: Build Mali module with CSF support (in-tree build)
        run: |
          cd kernel
          MALI_DIR="kernel_modules/kernel5.4/gpu/gondul/mali_new"
          if [ -d "$MALI_DIR" ]; then
            echo "=== Building Mali module with CSF support ==="
            echo "MALI_DIR: $MALI_DIR"

            # Build external module from kernel source tree using M= parameter
            # This uses the kernel source tree (which has all headers) with O=out for output
            # Must explicitly pass ARCH and CROSS_COMPILE since each step runs in separate shell
            # Add Mali driver's UAPI directories to include path for #include <uapi/gpu/arm/midgard/...>
            # Also add kernel source tree's include/ for CSF UAPI headers (since they're included as <uapi/...>)
            # Use EXTRA_CFLAGS (not KCFLAGS) for external module builds; use absolute paths
            MALI_ABS_DIR="$(pwd)/$MALI_DIR"
            KERNEL_ABS_DIR="$(pwd)"
            make O=out M="$MALI_DIR" \
              ARCH=arm64 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CONFIG_MALI_MIDGARD=m \
              CONFIG_MALI_CSF_SUPPORT=y \
              CONFIG_MALI_DEVFREQ=y \
              CONFIG_MALI_GATOR_SUPPORT=y \
              CONFIG_MALI_DEBUG=n \
              CONFIG_MALI_PLATFORM_NAME="devicetree" \
              EXTRA_CFLAGS="-Wno-error -Wno-return-type -Wno-misleading-indentation -Wno-implicit-int -Wno-implicit-function-declaration -fno-sanitize=shadow-call-stack -I$MALI_ABS_DIR/base -I$MALI_ABS_DIR/include -I$KERNEL_ABS_DIR/include" \
              -j$(nproc) modules

            echo "Mali module build completed"
          else
            echo "ERROR: Mali driver not found at $MALI_DIR!"
            find . -name "mali_new" -type d 2>/dev/null || true
            exit 1
          fi

      - name: Verify module
        run: |
          cd kernel
          echo "=== Finding mali_kbase.ko ==="
          find . -name "mali_kbase.ko" -exec ls -lh {} \;
          find . -name "mali_kbase.ko" -exec file {} \;

      - name: Verify CSF support in module
        run: |
          cd kernel
          MODULE=$(find . -name "mali_kbase.ko" | head -1)
          if [ -z "$MODULE" ]; then
            echo "ERROR: mali_kbase.ko not found!"
            exit 1
          fi
          echo "=== Checking for CSF support in module ==="
          echo "Module: $MODULE"
          # Check for CSF-related strings in the module
          strings "$MODULE" | grep -i csf | head -20 || echo "No CSF strings found (may be in firmware)"
          # Check for CSF config in modinfo
          modinfo "$MODULE" | grep -i csf || true
          # Verify it's arm64
          file "$MODULE" | grep -q "aarch64" && echo "Module is aarch64 ✓" || echo "WARNING: Module may not be aarch64"
          # Check module size
          ls -lh "$MODULE"

      - name: Find module path for output
        id: find_module
        run: |
          cd kernel
          MODULE_PATH=$(find . -name "mali_kbase.ko" | head -1)
          if [ -z "$MODULE_PATH" ]; then
            echo "ERROR: mali_kbase.ko not found!"
            exit 1
          fi
          echo "path=$MODULE_PATH" >> $GITHUB_OUTPUT

      - name: Upload mali_kbase.ko
        uses: actions/upload-artifact@v4
        with:
          name: mali_kbase-ko-${{ env.KERNEL_COMMIT }}
          path: kernel/**/mali_kbase.ko
          retention-days: 30
          compression-level: 6

      - name: Upload build info
        run: |
          cd kernel
          echo "Kernel commit: ${KERNEL_COMMIT}" > build-info.txt
          echo "Branch: ${KERNEL_REF}" >> build-info.txt
          echo "CSF enabled: ${ENABLE_CSF}" >> build-info.txt
          echo "Build date: $(date -u)" >> build-info.txt
          uname -a >> build-info.txt
          echo "Module size: $(ls -lh **/mali_kbase.ko 2>/dev/null | awk '{print $5}' | head -1)" >> build-info.txt
          cat build-info.txt

      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: build-info-${{ env.KERNEL_COMMIT }}
          path: kernel/build-info.txt
          retention-days: 30

  release:
    name: Create Release
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: mali-csf-${{ needs.build.outputs.kernel_commit || github.sha }}
          name: "Mali CSF Module - ${{ needs.build.outputs.kernel_commit || github.sha }}"
          body: |
            Mali kernel module with CSF (Valhall) support for Transsion UMS9230

            **Kernel:** `${{ needs.build.outputs.kernel_commit || github.sha }}`
            **Branch:** `${{ github.event.inputs.kernel_ref || 'master' }}`
            **CSF Enabled:** ${{ github.event.inputs.enable_csf || 'true' }}

            **Install:**
            ```bash
            adb push mali_kbase.ko /data/local/tmp/
            adb shell "insmod /data/local/tmp/mali_kbase.ko"
            ```

            **Verify:**
            ```bash
            adb shell "dmesg -T | grep -i -e mali -e csf"
            ```
          files: |
            artifacts/mali_kbase-ko-*/mali_kbase.ko
            artifacts/build-info-*/build-info.txt
          draft: false
          prerelease: false