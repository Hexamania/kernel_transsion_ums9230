name: Build Mali CSF Module (Transsion UMS9230 GKI)

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: 'Kernel branch/tag/commit to build'
        required: false
        default: 'master'
        type: string
      enable_csf:
        description: 'Enable CSF (Valhall) support'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build Mali CSF Module
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KERNEL_REPO: https://github.com/Bocchi-The-Dev/kernel_transsion_ums9230.git
      KERNEL_REF: ${{ github.event.inputs.kernel_ref || 'master' }}
      ENABLE_CSF: ${{ github.event.inputs.enable_csf || 'true' }}

    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld llvm \
            libssl-dev bc flex bison libelf-dev dwarves \
            python3 git wget cpio kmod ccache \
            python3-pyelftools libncurses5-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup clang
        run: |
          clang --version
          which ld.lld
          which llvm-ar

      - name: Clone kernel source (shallow)
        run: |
          git clone --depth=1 --branch "${KERNEL_REF}" "${KERNEL_REPO}" kernel
          cd kernel
          echo "KERNEL_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Check Mali CSF config
        run: |
          cd kernel
          echo "=== Mali configs ==="
          grep -r "CONFIG_MALI" arch/arm64/configs/ 2>/dev/null | head -20 || true
          grep -r "CONFIG_MALI_CSF_SUPPORT" . || echo "CSF config not found"

      - name: Apply ARM Mali driver (BX304L01B-r44p1)
        if: ${{ env.ENABLE_CSF == 'true' }}
        run: |
          cd kernel
          if [ ! -d "kernel_modules/kernel5.4/gpu/gondul/mali_new" ]; then
            mkdir -p kernel_modules/kernel5.4/gpu/gondul
            cp -r ${{ github.workspace }}/drivers/mali/arm-official \
              kernel_modules/kernel5.4/gpu/gondul/mali_new
          fi

      - name: Build kernel (GKI style)
        run: |
          cd kernel
          # Debug: show build.config content
          echo "=== build.config.gki.aarch64 ==="
          cat build.config.gki.aarch64
          echo "================================="

          # Try to download Android kernel build.sh from AOSP (correct path)
          # First try kernel-build-tools repo with build/ subdir
          curl -fsL -o build.sh https://raw.githubusercontent.com/google/kernel-build-tools/main/build/build.sh || \
          curl -fsL -o build.sh https://raw.githubusercontent.com/google/kernel-build-tools/main/build.sh || \
          { echo "Trying kernel source build.sh..."; ls -la build.sh 2>/dev/null || echo "No build.sh in kernel source"; }

          if [ -f build.sh ] && [ -s build.sh ] && head -1 build.sh | grep -q "^#!"; then
            chmod +x build.sh
            # Set up toolchain environment
            export ARCH=arm64
            export CC=clang
            export LD=ld.lld
            export AR=llvm-ar
            export NM=llvm-nm
            export OBJCOPY=llvm-objcopy
            export OBJDUMP=llvm-objdump
            export READELF=llvm-readelf
            export STRIP=llvm-strip
            export CROSS_COMPILE=aarch64-linux-gnu-
            export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            export CLANG_TRIPLE=aarch64-linux-gnu-

            # Build kernel using GKI build config
            BUILD_CONFIG=build.config.gki.aarch64 ./build.sh
          else
            echo "build.sh not found or invalid, using manual GKI build..."
            # Manual GKI build using build.config
            # Extract defconfig from build.config - handle various formats
            DEFCONFIG=$(grep -E '^KERNEL_DEFCONFIG=' build.config.gki.aarch64 | head -1 | cut -d= -f2- | tr -d '"' | tr -d "'" | xargs || echo "gki_defconfig")
            EXTRA_CONFIGS=$(grep -E '^EXTRA_CONFIGS=' build.config.gki.aarch64 | head -1 | cut -d= -f2- | tr -d '"' | tr -d "'" | xargs || echo "")

            echo "DEFCONFIG: '${DEFCONFIG}'"
            echo "EXTRA_CONFIGS: '${EXTRA_CONFIGS}'"

            export ARCH=arm64
            export CC=clang
            export LD=ld.lld
            export AR=llvm-ar
            export NM=llvm-nm
            export OBJCOPY=llvm-objcopy
            export OBJDUMP=llvm-objdump
            export READELF=llvm-readelf
            export STRIP=llvm-strip
            export CROSS_COMPILE=aarch64-linux-gnu-
            export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            export CLANG_TRIPLE=aarch64-linux-gnu-

            # Check if defconfig exists
            if [ -f "arch/arm64/configs/${DEFCONFIG}" ] || [ -f "arch/arm64/configs/${DEFCONFIG}_defconfig" ]; then
              make O=out ${DEFCONFIG}
            else
              # Try common GKI defconfigs
              for d in gki_defconfig gki_aarch64_defconfig vendor_gki_defconfig; do
                if [ -f "arch/arm64/configs/${d}" ]; then
                  DEFCONFIG=$d
                  break
                fi
              done
              echo "Using defconfig: ${DEFCONFIG}"
              make O=out ${DEFCONFIG}
            fi

            if [ -n "${EXTRA_CONFIGS}" ]; then
              for config in ${EXTRA_CONFIGS}; do
                if [ -f "${config}" ]; then
                  scripts/kconfig/merge_config.sh -m -O out out/.config ${config}
                else
                  echo "Config fragment not found: ${config}"
                fi
              done
            fi
            make O=out -j$(nproc)
          fi

          # Build modules
          make O=out modules -j$(nproc)

      - name: Build Mali module with CSF
        run: |
          cd kernel
          MALI_DIR="kernel_modules/kernel5.4/gpu/gondul/mali_new"
          if [ -d "$MALI_DIR" ]; then
            cd "$MALI_DIR"
            make KDIR=../../../../out \
              CONFIG_MALI_MIDGARD=m \
              CONFIG_MALI_CSF_SUPPORT=y \
              CONFIG_MALI_DEVFREQ=y \
              CONFIG_MALI_GATOR_SUPPORT=y \
              CONFIG_MALI_DEBUG=n \
              -j$(nproc)
          else
            echo "Mali driver not found!"
            exit 1
          fi

      - name: Verify module
        run: |
          cd kernel
          find . -name "mali_kbase.ko" -exec ls -lh {} \;
          find . -name "mali_kbase.ko" -exec file {} \;

      - name: Upload mali_kbase.ko
        uses: actions/upload-artifact@v4
        with:
          name: mali_kbase-ko-${{ env.KERNEL_COMMIT }}
          path: kernel/**/mali_kbase.ko
          retention-days: 30
          compression-level: 6

      - name: Upload build info
        run: |
          cd kernel
          echo "Kernel commit: ${KERNEL_COMMIT}" > build-info.txt
          echo "Branch: ${KERNEL_REF}" >> build-info.txt
          echo "CSF enabled: ${ENABLE_CSF}" >> build-info.txt
          echo "Build date: $(date -u)" >> build-info.txt
          uname -a >> build-info.txt
          echo "Module size: $(ls -lh **/mali_kbase.ko 2>/dev/null | awk '{print $5}' | head -1)" >> build-info.txt
          cat build-info.txt

      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: build-info-${{ env.KERNEL_COMMIT }}
          path: kernel/build-info.txt
          retention-days: 30

  release:
    name: Create Release
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: mali-csf-${{ needs.build.outputs.kernel_commit || github.sha }}
          name: "Mali CSF Module - ${{ needs.build.outputs.kernel_commit || github.sha }}"
          body: |
            Mali kernel module with CSF (Valhall) support for Transsion UMS9230

            **Kernel:** `${{ needs.build.outputs.kernel_commit || github.sha }}`
            **Branch:** `${{ github.event.inputs.kernel_ref || 'master' }}`
            **CSF Enabled:** ${{ github.event.inputs.enable_csf || 'true' }}

            **Install:**
            ```bash
            adb push mali_kbase.ko /data/local/tmp/
            adb shell "insmod /data/local/tmp/mali_kbase.ko"
            ```

            **Verify:**
            ```bash
            adb shell "dmesg -T | grep -i -e mali -e csf"
            ```
          files: |
            artifacts/mali_kbase-ko-*/mali_kbase.ko
            artifacts/build-info-*/build-info.txt
          draft: false
          prerelease: false